# Minimal broker configuration used by the quickstart and CLI examples.
# All values are the built-in defaults (see internal/infrastructure/config).
listen-addr: "127.0.0.1:9090"
data-dir: "data"
log-level: "info"
development: true
shutdown-grace: "10s"
monitor-addr: "127.0.0.1:9091"
storage:
  segment-max-bytes: 536870912
  index-interval-bytes: 4096
  sync-mode: "every-write"
  sync-interval: "100ms"
  retention-interval: "30s"
subscribe:
  read-limit: 512
  read-max-bytes: 1048576
tls:
  cert-file: ""
  key-file: ""
  client-ca-file: ""
# Auth restricts publish/consume to clients bearing one of these tokens; an
# empty resolved set (the default) leaves the broker unauthenticated. In
# production, prefer setting tokens via PULSE_AUTH_TOKENS (comma-separated)
# or PULSE_AUTH_TOKEN_FILE rather than committing them here.
# auth:
#   tokens: []
#   token-file: ""
